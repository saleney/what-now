<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Should We Do?</title>
<style>
:root{--paper:#faf7ef;--ink:#41483f;--muted:#898a80;--line:#ddd9cd;--green:#718d6c;--dark:#526c4e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Trebuchet MS","Avenir Next",system-ui,sans-serif}
.app{width:min(680px,100%);min-height:100vh;margin:auto;padding:18px 18px 20px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center}
.brand{font:italic 15px Georgia,serif;color:var(--dark)}
.reset{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
main{flex:1;display:flex;align-items:center;justify-content:center}
.screen{width:100%;text-align:center;padding:18px 0;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.mark{font-size:38px;margin-bottom:15px}
h1,h2{font-family:Georgia,serif;font-weight:400}
h1{font-size:clamp(46px,10vw,70px);line-height:.95;margin:0 0 12px}
.question{font:24px Georgia,serif;margin:0 0 20px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(540px,100%);margin:auto}
.choice{min-height:92px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.58);color:var(--ink);font:inherit;font-size:17px;font-weight:800;cursor:pointer;padding:12px}
.choice:hover{background:#fffdf8;transform:translateY(-1px)}
.emoji{display:block;font-size:31px;margin-bottom:5px}
.age-sub{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}
.activity{width:min(570px,100%);margin:auto;text-align:left}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--dark);font-weight:800;margin-bottom:9px}
.activity-emoji{font-size:40px;margin-bottom:8px}
h2{font-size:44px;line-height:1;margin:0 0 14px}
.copy{font:20px/1.45 Georgia,serif;color:#5f645b;margin:0 0 20px}
.do{background:#eeebe2;border-radius:16px;padding:16px;font-size:16px;line-height:1.45;margin:16px 0}
.meta{display:flex;gap:12px;color:var(--muted);font-size:12px;margin-bottom:15px}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.action{border:0;border-radius:999px;background:var(--green);color:white;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer}
.secondary{background:transparent;color:var(--muted);border:1px solid var(--line)}
.note{color:var(--muted);font-size:12px;margin-top:15px}
footer{text-align:center;color:#aaa99f;font-size:11px}
@media(max-width:500px){.app{padding:14px}.question{font-size:22px}.choice{min-height:84px;font-size:16px}.activity h2{font-size:38px}.copy{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">a little something</div><button class="reset" onclick="home()">start over</button></header>
<main id="main"></main>
<footer>Less consuming. More doing.</footer>
</div>

let state={age:null,kids:null};

function render(x){document.getElementById("main").innerHTML=`<section class="screen">${x}</section>`}

function home(){
 state={age:null,kids:null,mode:null,stuff:null};
 render(`
  <div class="mark">✦</div>
  <h1>Hmm.</h1>
  <div class="question">What kind of moment are you having?</div>
  <div class="choices">
   <button class="choice" onclick="pickMode('bored')"><span class="emoji">😐</span>We're bored</button>
   <button class="choice" onclick="pickMode('move')"><span class="emoji">⚡</span>We need to move</button>
   <button class="choice" onclick="pickMode('make')"><span class="emoji">🎨</span>We want to make something</button>
   <button class="choice" onclick="pickMode('calm')"><span class="emoji">🌙</span>We need something calm</button>
   <button class="choice" onclick="pickMode('explore')" style="grid-column:1/-1"><span class="emoji">🔎</span>Let's see what happens</button>
  </div>
 `);
}

function pickMode(mode){
 state.mode=mode;
 render(`
  <div class="mark">✦</div>
  <div class="question">How old are they?</div>
  <div class="choices">
   <button class="choice" onclick="pickAge('2-3')"><span class="emoji">🌱</span>Toddlers<span class="age-sub">2–3 years</span></button>
   <button class="choice" onclick="pickAge('4-5')"><span class="emoji">🪁</span>Preschoolers<span class="age-sub">4–5 years</span></button>
   <button class="choice" onclick="pickAge('6-8')"><span class="emoji">🔭</span>Big Kids<span class="age-sub">6–8 years</span></button>
   <button class="choice" onclick="pickAge('9+')"><span class="emoji">🧭</span>Older Kids<span class="age-sub">9+ years</span></button>
   <button class="choice" onclick="pickAge('mixed')" style="grid-column:1/-1"><span class="emoji">👧🧒</span>Mixed Ages<span class="age-sub">Different ages together</span></button>
  </div>
 `);
}
function pickAge(age){
 state.age=age;
 render(`
  <div class="mark">✦</div>
  <div class="question">What do we have to work with?</div>
  <div class="choices">
   <button class="choice" onclick="pickStuff('around')"><span class="emoji">🏠</span>Just what's around</button>
   <button class="choice" onclick="pickStuff('make')"><span class="emoji">🎨</span>Stuff to make with</button>
   <button class="choice" onclick="pickStuff('outside')"><span class="emoji">🌳</span>We can go outside</button>
   <button class="choice" onclick="pickStuff('somewhere')"><span class="emoji">🚗</span>We can go somewhere</button>
   <button class="choice" onclick="pickStuff('anything')" style="grid-column:1/-1"><span class="emoji">🤷</span>Anything goes</button>
  </div>
 `);
}

function pickStuff(stuff){
 state.stuff=stuff;
 render(`
  <div class="mark">✦</div>
  <div class="question">How many kids?</div>
  <div class="choices">
   <button class="choice" onclick="pickKids('1')"><span class="emoji">👤</span>1</button>
   <button class="choice" onclick="pickKids('2')"><span class="emoji">👥</span>2</button>
   <button class="choice" onclick="pickKids('3+')"><span class="emoji">👨‍👩‍👧</span>3+</button>
  </div>
 `);
}
function pickKids(kids){
 state.kids=kids;
 render(`
  <div class="mark">✦</div>
  <div class="question">Hmm...</div>
 `);
 setTimeout(showActivity, 450);
}
function showActivity(){
 let pool=activities.filter(a=>a.age.includes(state.age)&&a.kids.includes(state.kids));
 if(!pool.length) pool=activities.filter(a=>a.age.includes(state.age));

 const modeMap={
  move:["move"], make:["make"], calm:["calm"], explore:["explore"],
  bored:["move","make","explore","calm"]
 };
 if(state.mode && modeMap[state.mode]){
  const modePool=pool.filter(a=>modeMap[state.mode].some(m=>a.energy && a.energy.includes(m)));
  if(modePool.length) pool=modePool;
 }

 const stuffMap={
  around:["any"], make:["make","any"], outside:["outside","any"],
  somewhere:["outside","any"], anything:["any","make","move","calm","explore"]
 };
 if(state.stuff && stuffMap[state.stuff]){
  const stuffPool=pool.filter(a=>stuffMap[state.stuff].some(m=>a.materials && a.materials.includes(m)));
  if(stuffPool.length) pool=stuffPool;
 }

 if(!pool.length) pool=activities;

 const a=pool[Math.floor(Math.random()*pool.length)];
 current=a;

 render(`
  <div class="activity">
   <div class="kicker">${state.age==="mixed"?"mixed ages":"for "+state.age}</div>
   <div class="activity-emoji">${a.emoji}</div>
   <h2>${a.title}</h2>
   <p class="copy">${a.copy}</p>
   <div class="do"><strong>Try this:</strong><br>${a.do}</div>
   <div class="meta">
    <span>⏱ ${a.time}</span>
    <span>👧 ${state.kids} ${state.kids==="1"?"child":"children"}</span>
    ${a.adult?`<span>👋 ${a.adult==="together"?"do it together":a.adult==="supervise"?"mostly supervise":"they can try it themselves"}</span>`:""}
    ${a.mess?`<span>🧹 ${a.mess}</span>`:""}
   </div>
   <div class="actions">
    <button class="action" onclick="showActivity()">↻ Another</button>
    <button class="action secondary" onclick="home()">Start over</button>
   </div>
   <div class="note">Follow their curiosity. Change it if they take it somewhere better.</div>
  </div>
 `);
}
home();
</script>
